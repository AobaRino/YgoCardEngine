name: 构建与部署

on:
  push:
    branches: [master]
  pull_request:
  # 每天拉取一次上游最新卡片数据并重新部署
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下载最新卡片数据
        run: npm run data:update
      # 导出图片用的缩略图：缓存已下载的，每次只补新卡（PR 检查不需要）
      - name: 恢复缩略图缓存
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - name: 下载新卡缩略图
        id: thumbs
        if: github.event_name != 'pull_request'
        run: npm run thumbs
        # 第一次需要下载全部卡图；超时或图床出问题也不影响发布，下次继续补
        timeout-minutes: 120
        continue-on-error: true
      - name: 保存缩略图缓存
        if: always() && steps.thumbs.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/thumbs
          key: thumbs-${{ github.run_id }}
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
